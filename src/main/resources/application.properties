spring.application.name=siga-iea

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/siga}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:siga}
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234567} --- BD LOCAL ---
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
# spring.jpa.database-platform autodetectado por Hibernate 6.6+
spring.jpa.open-in-view=false

# --- Flyway Database Migrations ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}
spring.devtools.restart.enabled=${SPRING_DEVTOOLS_RESTART_ENABLED:true}

# --- Caché HTTP y Compresión para respuestas y recursos estáticos ---
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# --- MinIO Storage ---
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:admin}
minio.secret-key=${MINIO_SECRET_KEY:admin123}
minio.bucket-name=${MINIO_BUCKET:siga}

# --- File Upload Limits ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# --- Limites de Jornada Institucional ---
siga.jornada.manana.inicio=07:00
siga.jornada.manana.fin=12:30
siga.jornada.tarde.inicio=13:00
siga.jornada.tarde.fin=18:30
siga.jornada.tolerancia-minutos=0

# --- Chatbot & Asistente Inteligente (Groq Cloud / Ollama Local) ---
siga.chat.groq.api-key=${GROQ_API_KEY:}
siga.chat.groq.url=${GROQ_API_URL:https://api.groq.com/openai/v1}
siga.chat.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
siga.chat.ollama.url=${OLLAMA_URL:http://localhost:11434}
siga.chat.ollama.model=${OLLAMA_MODEL:llama3.2:1b}

# --- Seguridad & URL Pública ---
app.security.remember-me-key=${APP_REMEMBER_ME_KEY:siga-ieaci-dev-remember-me-key}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# --- Correo Electrónico Institucional (SMTP) ---
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@ieaci.edu.co}
app.mail.from-name=${APP_MAIL_FROM_NAME:SIGA - IEACI Institucional}
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}

# --- Analítica Institucional (Power BI) ---
siga.bi.powerbi-url=${SIGA_POWERBI_URL:https://app.powerbi.com/view?r=eyJrIjoiMGU5YTlmZWQtZTUyMy00MjBjLTkzYmEtMmNmOTI4YjI0N2NlIiwidCI6IjlkMTJiZjNmLWU0ZjYtNDdhYi05MTJmLTFhMmYwZmM0OGFhNCIsImMiOjR9}

# --- Seeder Masivo Bajo Demanda (Institución Grande) ---
siga.seed.enabled=${SIGA_SEED_ENABLED:false}
siga.seed.exit-after=${SIGA_SEED_EXIT_AFTER:false}


