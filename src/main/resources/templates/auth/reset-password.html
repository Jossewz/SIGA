<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title ?: 'Restablecer Contraseña – SIGA IEACI'}">Restablecer Contraseña – SIGA IEACI</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <script th:src="@{/js/lucide.min.js}"></script>
</head>
<body class="min-h-screen bg-page-bg flex items-center justify-center p-4 font-sans text-text-primary">

<div class="w-full max-w-md bg-white rounded-3xl border border-border shadow-xl p-8 flex flex-col gap-5">
    <div class="flex items-center gap-3 pb-4 border-b border-border/60">
        <div class="size-11 rounded-2xl bg-sidebar text-white grid place-items-center shadow-sm">
            <i data-lucide="key-round" class="size-5 stroke-2"></i>
        </div>
        <div>
            <h1 class="text-lg font-black text-text-primary tracking-tight leading-tight">Nueva Contraseña</h1>
            <p class="text-[11px] font-semibold text-text-secondary">SIGA · IEACI Institucional</p>
        </div>
    </div>

    <div th:if="${errorMessage}" class="p-3.5 rounded-xl bg-pill-red border border-[#f5cece] text-alert-red text-xs font-semibold flex items-center gap-2.5">
        <i data-lucide="alert-circle" class="size-4 shrink-0 stroke-[2.5]"></i>
        <span th:text="${errorMessage}">Error</span>
    </div>

    <div th:if="${!tokenValido}" class="flex flex-col gap-4 text-center py-4">
        <div class="size-12 rounded-full bg-pill-red text-alert-red grid place-items-center mx-auto border border-[#f5cece]">
            <i data-lucide="shield-alert" class="size-6 stroke-2"></i>
        </div>
        <div class="space-y-1">
            <h2 class="text-sm font-black text-text-primary">Enlace inválido o expirado</h2>
            <p class="text-xs font-medium text-text-secondary leading-relaxed">
                Este enlace ya fue utilizado o superó los 30 minutos de vigencia. Regresa al inicio de sesión para solicitar uno nuevo.
            </p>
        </div>
        <a th:href="@{/login}" class="w-full py-2.5 rounded-xl bg-sidebar text-white text-xs font-extrabold hover:brightness-110 transition-all inline-flex items-center justify-center gap-2">
            <i data-lucide="arrow-left" class="size-4"></i>
            <span>Volver al Login</span>
        </a>
    </div>

    <form th:if="${tokenValido}" th:action="@{/reset-password}" method="post" class="flex flex-col gap-4">
        <input type="hidden" name="token" th:value="${token}">

        <div class="flex flex-col gap-1.5">
            <label for="new-password" class="text-[11px] font-black uppercase tracking-wider text-text-secondary">Nueva Contraseña (mínimo 8 caracteres)</label>
            <input type="password" id="new-password" name="password" minlength="8" required
                   autocomplete="new-password"
                   placeholder="••••••••"
                   class="w-full h-11 px-4 rounded-xl border border-border bg-white text-xs font-semibold text-text-primary focus:border-sidebar focus:ring-2 focus:ring-sidebar/20 outline-none">
        </div>

        <div class="flex flex-col gap-1.5">
            <label for="confirm-password" class="text-[11px] font-black uppercase tracking-wider text-text-secondary">Confirmar Contraseña</label>
            <input type="password" id="confirm-password" name="confirmPassword" minlength="8" required
                   autocomplete="new-password"
                   placeholder="••••••••"
                   class="w-full h-11 px-4 rounded-xl border border-border bg-white text-xs font-semibold text-text-primary focus:border-sidebar focus:ring-2 focus:ring-sidebar/20 outline-none">
        </div>

        <button type="submit" class="w-full h-11 rounded-xl bg-sidebar text-white font-extrabold text-xs hover:brightness-110 transition-all cursor-pointer flex items-center justify-center gap-2 shadow-md shadow-sidebar/20">
            <i data-lucide="check" class="size-4 stroke-[2.5]"></i>
            <span>Guardar Nueva Contraseña</span>
        </button>

        <a th:href="@{/login}" class="text-center text-xs font-bold text-text-secondary hover:text-sidebar transition-colors">
            Cancelar y volver al ingreso
        </a>
    </form>
</div>

<script>
    if (typeof lucide !== 'undefined') lucide.createIcons();
</script>
</body>
</html>
