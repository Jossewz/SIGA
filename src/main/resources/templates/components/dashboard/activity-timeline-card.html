<th:block xmlns:th="http://www.thymeleaf.org">

    <!-- ÚLTIMOS MOVIMIENTOS / TIMELINE (Limitado en Dashboard + enlace a vista completa) -->
    <article th:fragment="activityTimelineCard()" 
             class="p-6 rounded-xl bg-white border border-border shadow-soft flex flex-col h-full">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
            <h3 class="flex items-center gap-2 text-sidebar text-base font-black uppercase tracking-wider">
                <i data-lucide="activity" class="size-[18px] stroke-[2.2]"></i>
                Línea de Actividad
            </h3>
            <span th:if="${stats.totalActividadTimeline > 0}"
                  class="px-2.5 py-1 rounded-full bg-surface-sunken border border-border text-[10px] font-black uppercase tracking-wide text-text-secondary"
                  th:text="${stats.totalActividadTimeline > #lists.size(stats.actividadTimeline) ? 'Últimos ' + #lists.size(stats.actividadTimeline) + ' de ' + stats.totalActividadTimeline : stats.totalActividadTimeline + ' eventos'}">
                Últimos 5
            </span>
        </div>

        <div class="relative border-l border-border ml-2.5 pl-6 space-y-4 flex-1">
            <div th:if="${#lists.isEmpty(stats.actividadTimeline)}" class="py-4 text-xs text-text-muted italic">
                Sin actividad reciente registrada en el sistema.
            </div>
            
            <div th:each="item : ${stats.actividadTimeline}" class="relative">
                <span class="absolute -left-[30px] top-1 flex items-center justify-center w-[12px] h-[12px] rounded-full bg-sidebar border-2 border-white"></span>
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <p class="text-xs font-extrabold text-text-primary leading-snug" th:text="${item.titulo}">Actividad registrada</p>
                    <span th:if="${item.categoriaLabel != null}"
                          class="px-2 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wide border"
                          th:classappend="${item.badgeClass}"
                          th:text="${item.categoriaLabel}">Log</span>
                </div>
                <p th:if="${item.detalle != null and !#strings.isEmpty(item.detalle)}"
                   class="text-[11px] font-medium text-text-secondary mt-0.5"
                   th:text="${item.detalle}">Detalle</p>
                <time class="text-[10px] text-text-muted font-bold uppercase tracking-wider block mt-0.5" th:text="${item.tiempo}">Tiempo</time>
            </div>
        </div>

        <div th:if="${!#lists.isEmpty(stats.actividadTimeline)}" class="mt-5 pt-4 border-t border-border/60 flex items-center justify-between gap-3">
            <span class="text-[11px] font-semibold text-text-secondary"
                  th:text="${stats.totalActividadTimeline > #lists.size(stats.actividadTimeline) ? 'Hay ' + (stats.totalActividadTimeline - #lists.size(stats.actividadTimeline)) + ' registros adicionales en el historial.' : 'Consulta el detalle completo y filtros de auditoría.'}">
                Ver historial completo
            </span>
            <a th:href="@{/actividad}"
               class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-surface-sunken hover:bg-pill-green text-sidebar border border-border text-xs font-black transition-colors shrink-0">
                <span>Mostrar más</span>
                <i data-lucide="arrow-right" class="size-3.5 stroke-[2.5]"></i>
            </a>
        </div>
    </article>

</th:block>
