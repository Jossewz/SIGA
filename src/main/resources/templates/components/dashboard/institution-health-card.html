<th:block xmlns:th="http://www.thymeleaf.org">

    <!-- ESTADO DE LA INSTITUCIÓN (SEMÁFOROS) -->
    <article th:fragment="institutionHealthCard()" 
             class="p-6 rounded-xl bg-white border border-border shadow-soft flex flex-col h-full">
        <h3 class="flex items-center gap-2 text-sidebar text-base font-black uppercase tracking-wider mb-5">
            <i data-lucide="activity" class="size-[18px] stroke-[2.2]"></i>
            Semáforos de Estado
        </h3>

        <ul class="grid gap-3.5 flex-1 justify-center">
            <li th:each="sem, iterStat : ${stats.semaforos}"
                class="flex items-center justify-between gap-6 py-1.5"
                th:classappend="${!iterStat.last} ? ' border-b border-border' : ''">
                <span class="text-xs font-bold text-text-primary flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full shadow-xs"
                          th:style="'background-color: ' + ${sem.dotColor}"></span>
                    <span th:text="${sem.titulo}">Asistencia General</span>
                </span>
                <span class="text-[10px] font-black uppercase tracking-wider border px-2 py-0.5 rounded"
                      th:classappend="${sem.badgeClass}"
                      th:text="${sem.estado}">Óptimo</span>
            </li>
        </ul>
    </article>

</th:block>
