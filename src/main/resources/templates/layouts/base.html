<!DOCTYPE html>
<html
lang="es"
xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
th:fragment="html(content)">


<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title
        th:text="${title ?: 'SIGA'}">
        SIGA
    </title>

    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">

    <!-- Metadatos de seguridad CSRF para Fetch/AJAX -->
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}"/>
    <meta name="_csrf_param" th:if="${_csrf}" th:content="${_csrf.parameterName}"/>

    <!-- Google Fonts: Inter (carga no bloqueante para renderizado inmediato) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>

    <!-- Tailwind CSS -->
    <link rel="stylesheet"
          th:href="@{/css/output.css}">

    <!-- Estilos defensivos para prevención de CLS y soporte Alpine x-cloak -->
    <style>
        [x-cloak] { display: none !important; }
        html.sidebar-init-collapsed #sidebar-desktop,
        #sidebar-desktop.is-collapsed {
            width: 74px !important;
            padding: 32px 8px 24px !important;
        }
        html.sidebar-init-collapsed #sidebar-desktop .sidebar-label,
        html.sidebar-init-collapsed #sidebar-desktop .sidebar-brand-logo,
        #sidebar-desktop.is-collapsed .sidebar-label,
        #sidebar-desktop.is-collapsed .sidebar-brand-logo {
            display: none !important;
        }
        html.sidebar-init-collapsed #sidebar-desktop .sidebar-brand-header,
        #sidebar-desktop.is-collapsed .sidebar-brand-header {
            justify-content: center !important;
            align-items: center !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }
        html.sidebar-init-collapsed #sidebar-desktop #sidebar-toggle-btn,
        #sidebar-desktop.is-collapsed #sidebar-toggle-btn {
            margin: 0 auto !important;
        }
        html.sidebar-init-collapsed #sidebar-desktop .sidebar-nav-item,
        #sidebar-desktop.is-collapsed .sidebar-nav-item {
            justify-content: center !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }
        html.sidebar-init-collapsed #sidebar-desktop .sidebar-chevron,
        #sidebar-desktop.is-collapsed .sidebar-chevron {
            transform: rotate(180deg) !important;
        }
    </style>

    <!-- Script temprano de prevención de parpadeo de layout (CLS = 0) -->
    <script>
        try {
            var sigaSb = localStorage.getItem('siga_sidebar_open');
            if (sigaSb === 'false' || (sigaSb === null && window.innerWidth < 1024)) {
                document.documentElement.classList.add('sidebar-init-collapsed');
            }
        } catch(e) {}
    </script>

    <!-- Metadatos de Seguridad CSRF -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}">

    <!-- Scripts locales (cero dependencias de CDN externas) -->
    <script th:src="@{/js/htmx.min.js}"></script>
    <script>
        // Inyectar automáticamente el token CSRF en todas las peticiones asíncronas de HTMX
        document.addEventListener('htmx:configRequest', function(evt) {
            const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
            const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
            if (token && header) {
                evt.detail.headers[header] = token;
            }
        });
    </script>
    <script th:src="@{/js/lucide.min.js}"></script>
    <script defer th:src="@{/js/mangle-chatbot.js}"></script>
    <script defer th:src="@{/js/alpine.min.js}"></script>
</head>

<body class="antialiased">

<div class="flex min-h-screen bg-page-bg max-md:flex-col"
     x-data="{
         sidebarOpen: (function() {
             try {
                 var val = localStorage.getItem('siga_sidebar_open');
                 return val !== null ? val === 'true' : (window.innerWidth >= 1024);
             } catch(e) {
                 return true;
             }
         })(),
         mobileOpen: false,
         toggleSidebar() {
             this.sidebarOpen = !this.sidebarOpen;
             try {
                 localStorage.setItem('siga_sidebar_open', this.sidebarOpen);
             } catch(e) {}
             var aside = document.getElementById('sidebar-desktop');
             if (aside) {
                 if (this.sidebarOpen) {
                     aside.classList.remove('is-collapsed');
                     document.documentElement.classList.remove('sidebar-init-collapsed');
                 } else {
                     aside.classList.add('is-collapsed');
                     document.documentElement.classList.add('sidebar-init-collapsed');
                 }
             }
         }
     }">

    <!-- SIDEBAR -->
    <aside
      th:replace="
      ~{layouts/sidebar :: sidebar(
        activePage=${activePage ?: ''},
        bottomText='',
        bottomUrl=''
      )}">
    </aside>

    <!-- CONTENIDO -->
    <main class="flex-1 min-w-0 flex flex-col">

        <!-- NAVBAR -->
        <header
          th:replace="
          ~{layouts/navbar :: navbar}">
        </header>

        <!-- Pintado inmediato de íconos en sidebar y navbar antes de finalizar carga del contenido -->
        <script>if (window.lucide && typeof window.lucide.createIcons === 'function') { window.lucide.createIcons(); }</script>

        <!-- CONTENIDO DINÁMICO -->
        <section
          class="flex-1 p-[28px_32px_32px] max-md:p-5 flex flex-col">

            <!-- Banner Alerta Sin Acceso -->
            <div th:if="${param.sinAcceso}" class="mb-5 p-4 rounded-xl bg-amber-50 border border-amber-300 text-xs font-bold text-amber-900 flex items-center gap-3 shadow-xs">
                <i data-lucide="shield-alert" class="size-5 text-amber-600 shrink-0"></i>
                <span>Acceso Restringido: No cuentas con permisos asignados para acceder a la vista requerida (<strong th:text="${param.sinAcceso}"></strong>). Contacta a la administración institucional si requieres habilitar este acceso.</span>
            </div>

            <th:block
              th:replace="${content}">
            </th:block>

        </section>

    </main>

</div>

<!-- CHATBOT ASISTENTE INSTITUCIONAL FLOTANTE (MANGLE) -->
<th:block th:replace="~{fragments/chatbot-flotante :: widget}"></th:block>

<!-- Contenedor global de alertas SIGA (Toast unificado) -->
<div id="siga-toast-container" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-2 max-w-md w-full pointer-events-none px-4 sm:px-0"></div>

<!-- Funciones globales de respaldo para interactividad garantizada -->
<script>
    window.sigaAlert = function(mensaje, tipo = 'error') {
        const cont = document.getElementById('siga-toast-container');
        if (!cont) {
            alert(mensaje);
            return;
        }
        const estilos = {
            success: 'bg-green-50 border-green-200 text-sidebar',
            warning: 'bg-amber-50 border-amber-300 text-amber-900',
            error: 'bg-red-50 border-red-200 text-alert-red',
            info: 'bg-surface border-border text-sidebar'
        };
        const iconos = {
            success: 'check-circle',
            warning: 'alert-triangle',
            error: 'alert-circle',
            info: 'info'
        };
        const t = estilos[tipo] ? tipo : 'error';
        const toast = document.createElement('div');
        toast.className = `pointer-events-auto p-3.5 rounded-xl border text-xs font-bold flex items-start gap-2.5 shadow-lg transition-all duration-300 ${estilos[t]}`;
        toast.innerHTML = `
            <i data-lucide="${iconos[t]}" class="size-4.5 shrink-0 mt-0.5"></i>
            <span class="flex-1 leading-snug"></span>
            <button type="button" onclick="this.parentElement.remove()" class="opacity-60 hover:opacity-100 cursor-pointer shrink-0">
                <i data-lucide="x" class="size-4"></i>
            </button>
        `;
        toast.querySelector('span').textContent = mensaje;
        cont.appendChild(toast);
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
        }
        setTimeout(() => {
            if (toast.parentElement) toast.remove();
        }, 5500);
    };

    window.toggleSigaSidebar = function() {
        var aside = document.getElementById('sidebar-desktop');
        if (!aside) return;
        var isCurrentlyCollapsed = aside.classList.contains('is-collapsed') || document.documentElement.classList.contains('sidebar-init-collapsed');
        if (isCurrentlyCollapsed) {
            aside.classList.remove('is-collapsed');
            document.documentElement.classList.remove('sidebar-init-collapsed');
            try { localStorage.setItem('siga_sidebar_open', 'true'); } catch(e) {}
        } else {
            aside.classList.add('is-collapsed');
            document.documentElement.classList.add('sidebar-init-collapsed');
            try { localStorage.setItem('siga_sidebar_open', 'false'); } catch(e) {}
        }
    };

    window.openSigaMobileDrawer = function() {
        var drawer = document.getElementById('mobile-sidebar-drawer');
        if (drawer) drawer.style.display = 'block';
    };

    window.closeSigaMobileDrawer = function() {
        var drawer = document.getElementById('mobile-sidebar-drawer');
        if (drawer) drawer.style.display = 'none';
    };

    function initLucideIcons() {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
        }
    }

    function initSigaTablePagination() {
        document.querySelectorAll('table.tabla-siga').forEach(function(table) {
            var card = table.closest('.rounded-surface, .rounded-xl, section') || table.parentElement;
            if (card && card.querySelector('[data-server-paginator="true"], nav[aria-label="Paginación de resultados"]:not([data-client-paginator])')) {
                return;
            }
            var tbody = table.querySelector('tbody');
            if (!tbody) return;

            var isSplitCol = !!table.closest('.lg\\:col-span-7');
            var pageSize = parseInt(table.dataset.pageSize || (isSplitCol ? '6' : '8'), 10);
            if (!table._sigaPage) table._sigaPage = 0;

            var wrapper = table.parentElement;
            var footer = wrapper.parentElement.querySelector('.siga-client-paginator');
            if (!footer) {
                footer = document.createElement('div');
                footer.className = 'siga-client-paginator flex flex-col sm:flex-row items-center justify-between gap-4 px-6 py-3.5 border-t border-border bg-white text-xs font-semibold text-text-secondary select-none rounded-b-surface';
                wrapper.insertAdjacentElement('afterend', footer);
            }

            function renderPage() {
                var allRows = Array.from(tbody.children).filter(function(tr) {
                    return tr.tagName === 'TR' && !tr.querySelector('td[colspan]');
                });
                if (allRows.length === 0) {
                    footer.style.display = 'none';
                    return;
                }
                var eligible = allRows.filter(function(tr) {
                    return tr.dataset.filteredOut !== 'true';
                });

                var total = eligible.length;
                var totalPages = Math.max(1, Math.ceil(total / pageSize));
                if (table._sigaPage >= totalPages) table._sigaPage = totalPages - 1;
                if (table._sigaPage < 0) table._sigaPage = 0;

                var start = table._sigaPage * pageSize;
                var end = Math.min(start + pageSize, total);

                allRows.forEach(function(tr) {
                    tr.style.display = 'none';
                });
                eligible.forEach(function(tr, idx) {
                    if (idx >= start && idx < end) {
                        tr.style.display = '';
                    }
                });

                if (total === 0) {
                    footer.style.display = 'none';
                    return;
                }
                footer.style.display = '';

                var startPage = Math.max(0, table._sigaPage - 2);
                var endPage = Math.min(totalPages - 1, table._sigaPage + 2);
                var navHtml = '';

                if (totalPages > 1) {
                    var prevDisabled = table._sigaPage === 0;
                    navHtml += '<nav data-client-paginator="true" class="flex items-center gap-1.5" aria-label="Paginación de resultados">';
                    navHtml += '<button type="button" data-page="' + (table._sigaPage - 1) + '" ' + (prevDisabled ? 'disabled ' : '') +
                        'class="inline-flex items-center gap-1 h-8 px-2.5 rounded-lg border text-xs font-bold transition-all ' +
                        (prevDisabled ? 'opacity-40 pointer-events-none cursor-not-allowed bg-surface-sunken/50 text-text-muted border-border/50' : 'bg-surface-sunken hover:bg-brand-100 text-brand-700 border-border cursor-pointer shadow-2xs') + '">' +
                        '<span class="max-sm:hidden">‹ Anterior</span><span class="sm:hidden">‹</span></button>';

                    if (startPage > 0) {
                        navHtml += '<button type="button" data-page="0" class="size-8 grid place-items-center rounded-lg border border-border bg-surface-sunken text-brand-700 hover:bg-brand-100 font-bold transition shadow-2xs cursor-pointer">1</button>';
                        if (startPage > 1) navHtml += '<span class="px-1 text-text-muted font-bold">...</span>';
                    }

                    for (var p = startPage; p <= endPage; p++) {
                        if (p === table._sigaPage) {
                            navHtml += '<button type="button" data-page="' + p + '" class="size-8 grid place-items-center rounded-lg bg-sidebar text-white font-black shadow-xs cursor-default">' + (p + 1) + '</button>';
                        } else {
                            navHtml += '<button type="button" data-page="' + p + '" class="size-8 grid place-items-center rounded-lg border border-border bg-surface-sunken text-brand-700 hover:bg-brand-100 font-bold transition shadow-2xs cursor-pointer">' + (p + 1) + '</button>';
                        }
                    }

                    if (endPage < totalPages - 1) {
                        if (endPage < totalPages - 2) navHtml += '<span class="px-1 text-text-muted font-bold">...</span>';
                        navHtml += '<button type="button" data-page="' + (totalPages - 1) + '" class="size-8 grid place-items-center rounded-lg border border-border bg-surface-sunken text-brand-700 hover:bg-brand-100 font-bold transition shadow-2xs cursor-pointer">' + totalPages + '</button>';
                    }

                    var nextDisabled = table._sigaPage >= totalPages - 1;
                    navHtml += '<button type="button" data-page="' + (table._sigaPage + 1) + '" ' + (nextDisabled ? 'disabled ' : '') +
                        'class="inline-flex items-center gap-1 h-8 px-2.5 rounded-lg border text-xs font-bold transition-all ' +
                        (nextDisabled ? 'opacity-40 pointer-events-none cursor-not-allowed bg-surface-sunken/50 text-text-muted border-border/50' : 'bg-surface-sunken hover:bg-brand-100 text-brand-700 border-border cursor-pointer shadow-2xs') + '">' +
                        '<span class="max-sm:hidden">Siguiente ›</span><span class="sm:hidden">›</span></button>';
                    navHtml += '</nav>';
                }

                footer.innerHTML =
                    '<div class="flex items-center gap-1.5 text-text-secondary">' +
                        '<span>Mostrando</span> ' +
                        '<strong class="text-text-primary font-black">' + (start + 1) + '</strong> ' +
                        '<span>a</span> ' +
                        '<strong class="text-text-primary font-black">' + end + '</strong> ' +
                        '<span>de</span> ' +
                        '<strong class="text-sidebar font-black">' + total + '</strong> ' +
                        '<span>registros</span>' +
                    '</div>' + navHtml;

                footer.querySelectorAll('button[data-page]').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var targetPage = parseInt(btn.getAttribute('data-page'), 10);
                        if (!isNaN(targetPage) && targetPage !== table._sigaPage) {
                            table._sigaPage = targetPage;
                            renderPage();
                        }
                    });
                });
            }

            table._sigaRenderPage = renderPage;
            renderPage();
        });
    }

    window.sigaRefreshPagination = function(resetPage) {
        document.querySelectorAll('table.tabla-siga').forEach(function(table) {
            if (resetPage) table._sigaPage = 0;
            if (typeof table._sigaRenderPage === 'function') {
                table._sigaRenderPage();
            }
        });
        initSigaTablePagination();
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            initLucideIcons();
            initSigaTablePagination();
        });
    } else {
        initLucideIcons();
        initSigaTablePagination();
    }
    document.addEventListener('htmx:afterSwap', function() {
        initLucideIcons();
        initSigaTablePagination();
    });

    document.body.addEventListener('htmx:beforeSwap', function(e) {
        if ([403, 409].includes(e.detail.xhr.status)) {
            e.detail.shouldSwap = true;
            e.detail.isError = false;
        }
    });
</script>

</body>
</html>
