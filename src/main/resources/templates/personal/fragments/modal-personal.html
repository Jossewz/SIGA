<th:block xmlns:th="http://www.thymeleaf.org">
    <!-- MODAL REGISTRAR PERSONAL -->
    <div th:fragment="modalPersonal" id="modal-personal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl border border-border shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden transition-all scale-95 opacity-0 duration-300" id="modal-personal-dialog">
            
            <!-- Modal Header -->
            <div class="p-6 border-b border-border flex justify-between items-center bg-white shrink-0">
                <div>
                    <h3 class="text-sidebar text-[18px] font-black">Registrar Nuevo Miembro del Personal</h3>
                    <p class="text-text-secondary text-[11px] font-bold">Ingrese los datos para la vinculación institucional de docentes o administrativos.</p>
                </div>
                <button type="button" onclick="closeModalPersonal()" class="p-1 hover:bg-pill-red text-text-secondary hover:text-alert-red rounded-lg transition-colors cursor-pointer">
                    <i data-lucide="x" class="size-5 stroke-2"></i>
                </button>
            </div>

            <!-- Modal Content (Form) -->
            <div class="p-6 overflow-y-auto flex-1 bg-white">
                <form id="form-personal" th:action="@{/personal/registrar}" method="POST" class="grid grid-cols-2 max-sm:grid-cols-1 gap-x-5 gap-y-4">
                    
                    <!-- Tipo de Personal -->
                    <div class="col-span-2 max-sm:col-span-1 flex flex-col">
                        <label for="p-tipo" class="text-text-primary text-[10px] font-black tracking-wider uppercase mb-1">
                            Tipo de Personal / Rol <span class="text-sidebar">*</span>
                        </label>
                        <select id="p-tipo" name="tipo" required onchange="actualizarCamposTipoPersonal()" class="w-full p-3 bg-white border border-border rounded-lg text-xs font-bold text-text-primary focus:ring-1 focus:ring-sidebar focus:outline-none">
                            <option value="DOCENTE">Docente / Profesor</option>
                            <option value="ADMINISTRATIVO">Personal Administrativo</option>
                            <option value="DIRECTIVO">Directivo / Rectoría</option>
                        </select>
                    </div>

                    <!-- Nombres y Apellidos -->
                    <div class="flex flex-col">
                        <label for="p-nombres" class="text-text-primary text-[10px] font-black tracking-wider uppercase mb-1">
                            Nombres Completos <span class="text-sidebar">*</span>
                        </label>
                        <input type="text" id="p-nombres" name="nombres" required placeholder="Ej: Carlos Andrés" class="w-full p-3 bg-white border border-border rounded-lg text-xs font-semibold text-text-primary focus:ring-1 focus:ring-sidebar focus:outline-none">
                    </div>

                    <div class="flex flex-col">
                        <label for="p-apellidos" class="text-text-primary text-[10px] font-black tracking-wider uppercase mb-1">
                            Apellidos <span class="text-sidebar">*</span>
                        </label>
                        <input type="text" id="p-apellidos" name="apellidos" required placeholder="Ej: Mendoza Pérez" class="w-full p-3 bg-white border border-border rounded-lg text-xs font-semibold text-text-primary focus:ring-1 focus:ring-sidebar focus:outline-none">
                    </div>

                    <!-- Tipo y Número de Documento -->
                    <div class="flex flex-col">
                        <label for="p-tipo-doc" class="text-text-primary text-[10px] font-black tracking-wider uppercase mb-1">
                            Tipo Documento <span class="text-sidebar">*</span>
                        </label>
                        <select id="p-tipo-doc" name="tipoDocumento" required class="w-full p-3 bg-white border border-border rounded-lg text-xs font-bold text-text-primary focus:ring-1 focus:ring-sidebar focus:outline-none">
                            <option value="CC">Cédula de Ciudadanía</option>
                            <option value="CE">Cédula de Extranjería</option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label for="p-doc" class="text-text-primary text-[10px] font-black tracking-wider uppercase mb-1">
                            Número Documento <span class="text-sidebar">*</span>
                        </label>
                        <input type="text" id="p-doc" name="numeroDocumento" required placeholder="Ej: 1098432101" class="w-full p-3 bg-white border border-border rounded-lg text-xs font-semibold text-text-primary focus:ring-1 focus:ring-sidebar focus:outline-none">
                    </div>

                    <!-- Teléfono y Género -->
                    <div class="flex flex-col">
                        <label for="p-phone" class="text-text-primary text-[10px] font-black tracking-wider uppercase mb-1">
                            Teléfono de Contacto <span class="text-sidebar">*</span>
                        </label>
                        <input type="tel" id="p-phone" name="telefono" required placeholder="3001234567" class="w-full p-3 bg-white border border-border rounded-lg text-xs font-semibold text-text-primary focus:ring-1 focus:ring-sidebar focus:outline-none">
                    </div>

                    <div class="flex flex-col">
                        <label for="p-sexo" class="text-text-primary text-[10px] font-black tracking-wider uppercase mb-1">
                            Género
                        </label>
                        <select id="p-sexo" name="sexo" class="w-full p-3 bg-white border border-border rounded-lg text-xs font-bold text-text-primary focus:ring-1 focus:ring-sidebar focus:outline-none">
                            <option value="">Seleccionar (Opcional)</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                            <option value="O">Otro</option>
                        </select>
                    </div>

                    <!-- Asignaturas (Select desplegable multi-opción desde materias del sistema, visible para DOCENTE) -->
                    <div id="grupo-asignaturas" class="col-span-2 max-sm:col-span-1 flex flex-col gap-1.5 relative">
                        <div class="flex items-center justify-between gap-2">
                            <label class="text-text-primary text-[10px] font-black tracking-wider uppercase">
                                Asignaturas <span class="text-sidebar">*</span>
                            </label>
                            <span id="asignaturas-count" class="px-2 py-0.5 rounded-full bg-surface-sunken border border-border text-[10px] font-extrabold text-brand-700">
                                0 seleccionadas
                            </span>
                        </div>

                        <div th:if="${materiasList != null and !#lists.isEmpty(materiasList)}" class="flex flex-col">
                            <!-- Barra / Trigger desplegable -->
                            <button type="button"
                                    id="asignaturas-trigger"
                                    onclick="toggleAsignaturasDropdown(event)"
                                    aria-expanded="false"
                                    class="w-full min-h-[42px] px-3 py-2.5 bg-white border border-border rounded-lg text-xs text-left flex items-center justify-between gap-2 hover:border-sidebar/50 focus:ring-1 focus:ring-sidebar focus:outline-none transition-all cursor-pointer">
                                <div id="asignaturas-trigger-content" class="flex flex-wrap items-center gap-1.5 flex-1 min-w-0">
                                    <span class="text-text-muted font-semibold">Seleccionar asignaturas...</span>
                                </div>
                                <i data-lucide="chevron-down" id="asignaturas-chevron" class="size-4 text-text-secondary transition-transform duration-200 shrink-0"></i>
                            </button>

                            <!-- Panel desplegable oculto por defecto -->
                            <div id="dropdown-asignaturas-panel" class="hidden mt-1.5 rounded-xl border border-border bg-white shadow-lg p-3 flex flex-col gap-2.5">
                                <div class="relative">
                                    <input type="text" id="filtro-asignaturas" oninput="filtrarAsignaturasModal(this.value)"
                                           placeholder="Buscar asignatura..."
                                           class="w-full h-8 pl-3 pr-8 rounded-lg bg-surface-muted border border-border text-xs font-medium text-text-primary focus:ring-1 focus:ring-sidebar focus:bg-white focus:outline-none">
                                    <i data-lucide="search" class="absolute right-2.5 top-1/2 -translate-y-1/2 size-3.5 text-text-muted pointer-events-none"></i>
                                </div>

                                <div id="lista-asignaturas-modal" class="grid grid-cols-2 max-sm:grid-cols-1 gap-2 max-h-44 overflow-y-auto pr-1">
                                    <label th:each="m : ${materiasList}"
                                           th:data-nombre="${m.nombre}"
                                           class="asignatura-option flex items-center gap-2.5 p-2 rounded-lg border border-border bg-white hover:border-sidebar/50 cursor-pointer transition-all select-none">
                                        <input type="checkbox"
                                               name="materiaIds"
                                               th:value="${m.id}"
                                               th:data-label="${m.nombre}"
                                               onchange="actualizarEstadoAsignatura(this)"
                                               class="asignatura-checkbox rounded border-gray-300 text-sidebar focus:ring-sidebar/20 size-4 shrink-0 cursor-pointer">
                                        <div class="min-w-0 flex-1">
                                            <span class="block text-xs font-bold text-text-primary truncate" th:text="${m.nombre}">Matemáticas</span>
                                            <span th:if="${m.area != null and !#strings.isEmpty(m.area)}"
                                                  class="block text-[10px] font-semibold text-text-secondary truncate"
                                                  th:text="${m.area}">Ciencias Exactas</span>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div th:if="${materiasList == null or #lists.isEmpty(materiasList)}"
                             class="p-3 rounded-xl bg-amber-50 border border-amber-200 text-xs font-semibold text-amber-800 flex items-center justify-between gap-2">
                            <span>No hay asignaturas activas registradas en el sistema todavía.</span>
                            <a th:href="@{/configuracion}" class="underline font-black shrink-0">Ir a Configuración</a>
                        </div>

                        <p id="asignaturas-error" class="hidden text-[11px] font-bold text-alert-red">
                            Debes seleccionar al menos una asignatura para el docente.
                        </p>
                    </div>

                    <!-- Cargo Institucional (Solo visible para ADMINISTRATIVO / DIRECTIVO) -->
                    <div id="grupo-cargo" class="hidden col-span-2 max-sm:col-span-1 flex flex-col">
                        <label for="p-cargo" class="text-text-primary text-[10px] font-black tracking-wider uppercase mb-1">
                            Cargo Institucional <span class="text-sidebar">*</span>
                        </label>
                        <input type="text" id="p-cargo" name="cargo" placeholder="Ej: Secretario Académico / Coordinador" class="w-full p-3 bg-white border border-border rounded-lg text-xs font-semibold text-text-primary focus:ring-1 focus:ring-sidebar focus:outline-none">
                    </div>

                </form>
            </div>

            <!-- Modal Footer -->
            <div class="p-6 border-t border-border flex justify-between items-center bg-surface-sunken shrink-0">
                <button type="button" onclick="closeModalPersonal()" class="px-5 py-3 text-xs font-black text-text-secondary bg-transparent hover:bg-pill-red hover:text-alert-red rounded-lg transition-all cursor-pointer">
                    Cancelar
                </button>
                <button type="submit" form="form-personal" class="px-6 py-3 text-xs font-black text-white bg-sidebar hover:brightness-97 rounded-lg transition-all flex items-center gap-2 shadow-md cursor-pointer">
                    <i data-lucide="check" class="size-4 stroke-[2.5]"></i>
                    <span>Registrar Personal</span>
                </button>
            </div>

        </div>
    </div>
</th:block>
